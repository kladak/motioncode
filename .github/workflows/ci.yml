name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: make test
      - name: Offline synthetic train (CI config)
        run: make train-ci
      - name: Metrics artifact exists
        run: |
          test -f reports/metrics.json
          python -c "import json; m=json.load(open('reports/metrics.json')); assert m['leakage_ok']; assert 'models' in m"
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics-json
          path: reports/metrics.json

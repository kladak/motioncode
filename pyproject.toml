[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motioncode"
version = "0.1.0"
description = "ECG-like waveform classification with reproducible pipelines and baselines"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Karim Ladak", email = "ladakakarim@gmail.com" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
physionet = [
  "wfdb>=4.1",
]

[project.scripts]
motioncode = "motioncode.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["motioncode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
